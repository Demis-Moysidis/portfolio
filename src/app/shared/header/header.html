<nav>
    <a class="logo" routerLink="/">DM</a>
    
    <a class="about-me" routerLink='/' fragment="about-me" [ngStyle]="headerForProjectDetail ? { 'color': 'black' } : {}">{{ 'header.about-me' | translate }}</a>
    <a class="skills" routerLink='/' fragment="skills" [ngStyle]="headerForProjectDetail ? { 'color': 'black' } : {}" [ngClass]="language.currentLanguage == 'de' ? 'contact-de' : '' ">{{ 'header.skills' | translate }} </a>
    <a class="projects" routerLink='/' fragment="projects">{{ 'header.projects' | translate }}</a>
    <a class="contact" routerLink='/' fragment="contact">{{ 'header.contact' | translate }}</a>  

    <div class="language-toggle">
        <p (click)="toggleLanguage('en')" [ngClass]="language.currentLanguage == 'en' ? 'language-active' : 'language-inactive-en'">EN</p>
        <div class="toggle-btn">
            <div></div>
            <div [ngClass]="language.currentLanguage == 'en' ? 'en' : 'de' "></div>
        </div>
        <p (click)="toggleLanguage('de')" [ngClass]="language.currentLanguage == 'de' ? 'language-active' : 'language-inactive-de'">DE</p>
    </div>
</nav>
